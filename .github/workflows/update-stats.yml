# Refresh market-stats, arbitrage, and thelake success stories daily around 9 AM Eastern.
# Cron is UTC-only: 13:00 UTC = 9 AM EDT / 8 AM EST.
# Do not gate on exact local hour: GitHub often starts scheduled jobs late.

name: Update stats

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .cursor/skills/update-stats/requirements.txt

      - name: Install dependencies
        run: pip install -r .cursor/skills/update-stats/requirements.txt

      - name: Refresh market stats + arbitrage + success stories
        run: |
          python3 .cursor/skills/update-stats/scripts/refresh_market_stats.py
          python3 .cursor/skills/update-stats/scripts/refresh_arbitrage.py
          python3 .cursor/skills/update-stats/scripts/refresh_success_stories.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            market-stats.md \
            market-stats.json \
            arbitrage.md \
            arbitrage.json \
            tokenomics.md \
            assets/market-easy-pools-24h.png \
            assets/market-easy-share.png \
            assets/arbitrage-heatmap.png \
            tokens/won/won-featured.png \
            our-story/success-stories.md \
            our-story/success-stories.json \
            our-story/assets/reflections-lake.png \
            our-story/assets/thelake-reflections-summary.png \
            our-story/assets/thelake-reflections-cumulative.png \
            our-story/assets/thelake-reflections-monthly.png \
            our-story/assets/thelake-vs-bluechips.png
          if git diff --staged --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh market stats, arbitrage, and success stories"
          # Scheduled runs can be detached HEAD; push explicitly to main.
          git push origin HEAD:main
